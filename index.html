<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artreel — 준비 중</title>
<meta name="description" content="Artreel — 준비 중">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #0b0f15; --text: #e8edf4; --muted: #9aa6b8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; word-break: keep-all; -webkit-font-smoothing: antialiased;

  .logo svg { width: min(380px, 72vw); height: auto; display: block; margin: 0 auto 40px; }

<main>

</html>
